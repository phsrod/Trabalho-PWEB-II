name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI — Validar código e containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Lint (Biome)
        working-directory: server
        run: npm run lint

      - name: Typecheck (TypeScript)
        working-directory: server
        run: npm run typecheck

      - name: Testes unitários
        working-directory: server
        run: npm run test:unit

      - name: Build e smoke test Docker
        run: |
          docker compose build
          docker compose up -d

          echo "Aguardando API..."
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3003/ping; then
              echo "API respondeu com sucesso."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "API não respondeu a tempo."
              docker compose logs api
              exit 1
            fi
            sleep 2
          done

          echo "Testando front-end..."
          curl -fs http://localhost:8080

          echo "Todos os testes passaram."

      - name: Encerrar containers
        if: always()
        run: docker compose down -v

  cd:
    name: CD — Publicar imagens Docker
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar nome do repositório
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build e push — API
        run: |
          IMAGE=ghcr.io/${REPO_LOWER}/barbearia-api
          docker build -f Dockerfile.api -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./server
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Build e push — Web
        run: |
          IMAGE=ghcr.io/${REPO_LOWER}/barbearia-web
          docker build -f Dockerfile.web -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Resumo do deploy
        run: |
          echo "## Deploy concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${REPO_LOWER}/barbearia-api\` | \`${{ github.sha }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${REPO_LOWER}/barbearia-web\` | \`${{ github.sha }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Imagens publicadas no **GitHub Packages** (aba Packages do repositório)." >> $GITHUB_STEP_SUMMARY
